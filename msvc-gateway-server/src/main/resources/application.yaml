resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 4
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50  
    instances:
      products:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
    instances:
      products:
        base-config: default       

spring:
  cloud:
    gateway:
      routes:
      - id: msvc-products
        uri: lb://msvc-products
        predicates:
        - Path=/api/products/**
        # - Header=token, 12345
        # - Method=GET, POST
        # - Query=name
        # - Cookie=color, azul
        # - Header=Content-Type, application/json

        filters:
        - name: CircuitBreaker
          args:
            name: products
            statusCodes: 500
            fallbackUri: forward:/api/items/5
        - StripPrefix=2
        - EjemploCookie=Personalized message to products, user, Ignacio
        # - name: SampleCookie
        #   args:
        #     message: Personalized message to products
        #     name: user
        #     value: Ignacio
      - id: msvc-items
        uri: lb://msvc-items
        predicates:
        - Path=/api/items/**
        filters:
        - StripPrefix=2
        - AddRequestHeader=tokenRequest, ignjs
        - AddResponseHeader=tokenResponse, 121231234
        - AddRequestParameter=name, Ignjs
        - SetResponseHeader=Content-Type, text/plain 